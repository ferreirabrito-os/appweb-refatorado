# ===================================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ===================================================================
spring.application.name=appweb

# ===================================================================
# CONEXÃO COM O BANCO DE DADOS
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:asdfgh}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# SEGURANÇA / JWT
# ===================================================================
api.security.token.secret=${JWT_SECRET:minha_chave_secreta_padrao_dev_123456}

# ===================================================================
# ADMIN INICIAL
# ===================================================================
api.security.admin.username=${ADMIN_USERNAME:admin}
api.security.admin.password=${ADMIN_PASSWORD:Admin@123}

# ===================================================================
# ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never